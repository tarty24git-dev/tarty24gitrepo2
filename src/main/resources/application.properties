# Application Branding and Configurations
spring.application.name=CTH Enterprise Reporting System

# Server Settings
server.port=8080

# JPA & Database Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Default Database Settings (H2 embedded for initial start; switchable to Oracle, PostgreSQL, MS SQL Server)
spring.datasource.url=jdbc:h2:mem:cthdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Custom CTH App Properties
cth.app.name=CTH Enterprise Reporting Platform
cth.auth.provider=DATABASE
cth.auth.sms-email-2fa-enabled=false
cth.db.type=H2

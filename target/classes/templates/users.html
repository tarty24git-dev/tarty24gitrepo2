<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Maintenance - CTH Enterprise Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body>
<div th:replace="~{layout/header :: navbar}"></div>

<div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0 text-light"><i class="bi bi-people text-primary me-2"></i> User Account Maintenance</h2>
            <p class="text-muted mb-0">Manage system users, locks, password expirations, and authentication settings</p>
        </div>
    </div>

    <div class="card bg-dark text-light p-4 shadow">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>2FA Enabled</th>
                        <th>Password Expiration</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.id}">1</td>
                        <td class="fw-bold text-primary" th:text="${u.username}">username</td>
                        <td th:text="${u.fullName}">Full Name</td>
                        <td th:text="${u.email}">email@example.com</td>
                        <td><span class="badge bg-info" th:text="${u.role}">ROLE_USER</span></td>
                        <td>
                            <span th:if="${u.locked}" class="badge bg-danger"><i class="bi bi-lock-fill"></i> LOCKED</span>
                            <span th:if="${!u.locked}" class="badge bg-success"><i class="bi bi-unlock-fill"></i> ACTIVE</span>
                        </td>
                        <td>
                            <span th:if="${u.require2Fa}" class="badge bg-primary">ENABLED</span>
                            <span th:if="${!u.require2Fa}" class="badge bg-secondary">DISABLED</span>
                        </td>
                        <td th:text="${#temporals.format(u.passwordExpirationDate, 'yyyy-MM-dd HH:mm')}">2026-12-31</td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <form th:if="${!u.locked}" th:action="@{/users/lock}" method="post" class="d-inline">
                                    <input type="hidden" name="userId" th:value="${u.id}"/>
                                    <button class="btn btn-outline-warning" type="submit"><i class="bi bi-lock"></i> Lock</button>
                                </form>
                                <form th:if="${u.locked}" th:action="@{/users/unlock}" method="post" class="d-inline">
                                    <input type="hidden" name="userId" th:value="${u.id}"/>
                                    <button class="btn btn-outline-success" type="submit"><i class="bi bi-unlock"></i> Unlock</button>
                                </form>
                                <form th:action="@{/users/toggle-2fa}" method="post" class="d-inline">
                                    <input type="hidden" name="userId" th:value="${u.id}"/>
                                    <button class="btn btn-outline-info" type="submit"><i class="bi bi-shield"></i> Toggle 2FA</button>
                                </form>
                                <form th:action="@{/users/expire-password}" method="post" class="d-inline">
                                    <input type="hidden" name="userId" th:value="${u.id}"/>
                                    <button class="btn btn-outline-danger" type="submit"><i class="bi bi-exclamation-triangle"></i> Expire Password</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
